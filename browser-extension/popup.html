<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperHub Clipper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 400px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
        }
        
        .container {
            padding: 20px;
        }
        
        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
            color: #303133;
        }
        
        /* 页面信息卡片 */
        .page-info {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .page-title {
            font-size: 14px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 8px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .page-url {
            font-size: 12px;
            color: #909399;
            word-break: break-all;
        }
        
        /* 剪藏模式选择 */
        .clip-modes {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #606266;
            margin-bottom: 12px;
        }
        
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .mode-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .mode-card:hover {
            border-color: #409eff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.2);
        }
        
        .mode-card.active {
            border-color: #409eff;
            background: #ecf5ff;
        }
        
        .mode-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .mode-name {
            font-size: 13px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 4px;
        }
        
        .mode-desc {
            font-size: 11px;
            color: #909399;
        }
        
        /* 操作按钮 */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #409eff;
            color: white;
        }
        
        .btn-primary:hover {
            background: #66b1ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-primary:disabled {
            background: #a0cfff;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: white;
            color: #606266;
            border: 1px solid #dcdfe6;
        }
        
        .btn-secondary:hover {
            border-color: #409eff;
            color: #409eff;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #909399;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #409eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 错误提示 */
        .error {
            background: #fef0f0;
            border: 1px solid #fde2e2;
            color: #f56c6c;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        /* 成功提示 */
        .success {
            background: #f0f9ff;
            border: 1px solid #d9ecff;
            color: #67c23a;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        /* 标签输入 */
        .tag-input {
            margin-top: 15px;
        }
        
        .tag-input label {
            display: block;
            font-size: 13px;
            color: #606266;
            margin-bottom: 8px;
        }
        
        .tag-input input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .tag-input input:focus {
            outline: none;
            border-color: #409eff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="logo">P</div>
            <div class="title">PaperHub Clipper</div>
        </div>
        
        <!-- 加载状态 -->
        <div id="loading-state" class="loading">
            <div class="spinner"></div>
            <div>正在分析页面...</div>
        </div>
        
        <!-- 主内容（初始隐藏） -->
        <div id="main-content" style="display: none;">
            <!-- 页面信息 -->
            <div class="page-info">
                <div class="page-title" id="page-title">加载中...</div>
                <div class="page-url" id="page-url"></div>
            </div>
            
            <!-- 错误提示 -->
            <div id="error-message" class="error" style="display: none;"></div>
            
            <!-- 成功提示 -->
            <div id="success-message" class="success" style="display: none;"></div>
            
            <!-- 剪藏模式选择 -->
            <div class="clip-modes">
                <div class="section-title">选择剪藏模式</div>
                <div class="mode-grid">
                    <div class="mode-card active" data-mode="full">
                        <div class="mode-icon">📄</div>
                        <div class="mode-name">全文剪藏</div>
                        <div class="mode-desc">提取正文到文章库</div>
                    </div>
                    <div class="mode-card" data-mode="selection">
                        <div class="mode-icon">✂️</div>
                        <div class="mode-name">选择剪藏</div>
                        <div class="mode-desc">选中内容到笔记</div>
                    </div>
                    <div class="mode-card" data-mode="smart">
                        <div class="mode-icon">🎯</div>
                        <div class="mode-name">智能剪藏</div>
                        <div class="mode-desc">AI提取关键信息</div>
                    </div>
                    <div class="mode-card" data-mode="quick">
                        <div class="mode-icon">📝</div>
                        <div class="mode-name">速记笔记</div>
                        <div class="mode-desc">快速记录想法</div>
                    </div>
                </div>
            </div>
            
            <!-- 标签输入 -->
            <div class="tag-input">
                <label>添加标签（可选，逗号分隔）</label>
                <input type="text" id="tags-input" placeholder="例如：技术, AI, 教程">
            </div>
            
            <!-- 操作按钮 -->
            <div class="actions" style="margin-top: 20px;">
                <button id="clip-btn" class="btn btn-primary">
                    <span>💾</span>
                    <span>保存到 PaperHub</span>
                </button>
                <button id="cancel-btn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
